name: medisync
description: MediSync - IoT-powered automated medicine dispenser app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase (Auth + FCM only) ─────────────────────────────────────────────
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  firebase_messaging: ^15.0.0
  google_sign_in: ^6.2.1

  # ── HTTP + Real-time ───────────────────────────────────────────────────────
  http: ^1.2.1
  socket_io_client: ^2.0.3+1

  # ── State management ───────────────────────────────────────────────────────
  provider: ^6.1.2

  # ── Local storage ─────────────────────────────────────────────────────────
  shared_preferences: ^2.2.3

  # ── Notifications ─────────────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # ── Biometric ─────────────────────────────────────────────────────────────
  local_auth: ^2.3.0

  # ── Charts ────────────────────────────────────────────────────────────────
  fl_chart: ^0.68.0

  # ── File handling / Sharing ────────────────────────────────────────────────
  share_plus: ^10.0.2
  path_provider: ^2.1.3
  open_filex: ^4.4.1

  # ── Connectivity ──────────────────────────────────────────────────────────
  connectivity_plus: ^6.0.3

  # ── Utilities ─────────────────────────────────────────────────────────────
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

